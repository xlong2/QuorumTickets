apiVersion: v1
kind: Service
metadata:
  name: quorum-tickets
  labels:
    app.kubernetes.io/name: quorum-tickets
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: quorum-tickets
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quorum-tickets
spec:
  serviceName: quorum-tickets
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: quorum-tickets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quorum-tickets
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: ghcr.io/xlong2/quorum-tickets:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "8080"
            - name: INITIAL_TICKETS
              value: "100"
            - name: PEERS
              value: >-
                quorum-tickets-0=http://quorum-tickets-0.quorum-tickets:8080,
                quorum-tickets-1=http://quorum-tickets-1.quorum-tickets:8080,
                quorum-tickets-2=http://quorum-tickets-2.quorum-tickets:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
