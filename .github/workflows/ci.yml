name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        run: sh ./mvnw --batch-mode verify

      - name: Build container
        run: docker build --tag quorum-tickets:ci .

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: quorum-tickets
          path: target/quorum-tickets.jar
