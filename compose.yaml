x-cluster-environment: &cluster-environment
  PORT: "8080"
  INITIAL_TICKETS: "100"
  PEERS: "node-0=http://node-0:8080,node-1=http://node-1:8080,node-2=http://node-2:8080"

services:
  node-0:
    build: .
    hostname: node-0
    environment:
      <<: *cluster-environment
      NODE_ID: node-0
    ports:
      - "8080:8080"

  node-1:
    build: .
    hostname: node-1
    environment:
      <<: *cluster-environment
      NODE_ID: node-1
    ports:
      - "8081:8080"

  node-2:
    build: .
    hostname: node-2
    environment:
      <<: *cluster-environment
      NODE_ID: node-2
    ports:
      - "8082:8080"
